<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Biometric Attendance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <div class="max-w-6xl mx-auto p-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-xl shadow-sm mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Office Attendance Portal</h1>
        <p class="text-sm text-slate-500">Live Biometric ADMS Sync &bull; <span id="device-status" class="font-semibold text-amber-600">Checking Device...</span></p>
      </div>
      <div class="flex gap-3">
        <input type="date" id="filter-date" class="border rounded-lg px-3 py-2 text-sm bg-slate-50" />
        <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
          Export CSV
        </button>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-5 rounded-xl shadow-sm">
        <p class="text-xs uppercase text-slate-400 font-semibold">Total Punches Today</p>
        <p id="stat-punches" class="text-3xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm">
        <p class="text-xs uppercase text-slate-400 font-semibold">Present Staff</p>
        <p id="stat-present" class="text-3xl font-bold text-blue-600 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm">
        <p class="text-xs uppercase text-slate-400 font-semibold">Late Arrivals (After 10:00 AM)</p>
        <p id="stat-late" class="text-3xl font-bold text-rose-600 mt-1">0</p>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Add Employee Card -->
      <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
        <h2 class="text-lg font-bold mb-4">Map Biometric ID</h2>
        <form id="emp-form" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Biometric Machine ID</label>
            <input type="text" id="emp-id" placeholder="e.g. 101" required class="w-full border rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Employee Name</label>
            <input type="text" id="emp-name" placeholder="e.g. Amit Sharma" required class="w-full border rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Department</label>
            <input type="text" id="emp-dept" placeholder="e.g. Sales / Accounts" class="w-full border rounded-lg px-3 py-2 text-sm" />
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-semibold">
            Save Employee
          </button>
        </form>
      </div>

      <!-- Live Logs Table -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold mb-4">Live Punch Logs</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b text-xs uppercase text-slate-400">
                <th class="py-3 px-2">ID</th>
                <th class="py-3 px-2">Employee Name</th>
                <th class="py-3 px-2">Time</th>
                <th class="py-3 px-2">Type</th>
                <th class="py-3 px-2">Status</th>
              </tr>
            </thead>
            <tbody id="logs-body" class="text-sm divide-y">
              <tr><td colspan="5" class="py-6 text-center text-slate-400">Waiting for biometric punches...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAF3qQk6-0cziBy1wfMe9kl_Rf9l8jjv1U",
      authDomain: "office-attendence-833fc.firebaseapp.com",
      projectId: "office-attendence-833fc",
      storageBucket: "office-attendence-833fc.firebasestorage.app",
      messagingSenderId: "637133294549",
      appId: "1:637133294549:web:7b1ad9b1edf08c2b340b5c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let employeeMap = {};
    let currentLogs = [];

    const dateInput = document.getElementById('filter-date');
    dateInput.value = new Date().toISOString().split('T')[0];

    db.collection('employees').onSnapshot(snap => {
      employeeMap = {};
      snap.forEach(doc => {
        employeeMap[doc.id] = doc.data();
      });
      renderLogs();
    });

    db.collection('devices').limit(1).onSnapshot(snap => {
      const statusEl = document.getElementById('device-status');
      if (!snap.empty) {
        const dev = snap.docs[0].data();
        statusEl.textContent = `Device ${dev.serialNumber} Connected`;
        statusEl.className = "font-semibold text-emerald-600";
      }
    });

    document.getElementById('emp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('emp-id').value.trim();
      const name = document.getElementById('emp-name').value.trim();
      const dept = document.getElementById('emp-dept').value.trim();

      await db.collection('employees').doc(id).set({ name, dept });
      e.target.reset();
    });

    let unsubscribeLogs = null;
    function subscribeLogs(selectedDate) {
      if (unsubscribeLogs) unsubscribeLogs();
      unsubscribeLogs = db.collection('attendance_logs')
        .where('date', '==', selectedDate)
        .onSnapshot(snap => {
          currentLogs = [];
          snap.forEach(doc => currentLogs.push(doc.data()));
          currentLogs.sort((a, b) => b.time.localeCompare(a.time));
          renderLogs();
        });
    }

    function renderLogs() {
      const tbody = document.getElementById('logs-body');
      document.getElementById('stat-punches').textContent = currentLogs.length;

      const uniqueUsers = new Set(currentLogs.map(l => l.biometricId));
      document.getElementById('stat-present').textContent = uniqueUsers.size;

      let lateCount = 0;
      const firstPunchByUser = {};
      [...currentLogs].reverse().forEach(l => {
        if (!firstPunchByUser[l.biometricId]) {
          firstPunchByUser[l.biometricId] = l.time;
          if (l.time > "10:00:00") lateCount++;
        }
      });
      document.getElementById('stat-late').textContent = lateCount;

      if (currentLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-400">No punches recorded for this date.</td></tr>';
        return;
      }

      tbody.innerHTML = currentLogs.map(log => {
        const emp = employeeMap[log.biometricId];
        const empName = emp ? `${emp.name} <span class="text-xs text-slate-400">(${emp.dept || ''})</span>` : '<span class="text-amber-600">Unmapped ID</span>';
        const isLate = log.time > "10:00:00" && log.punchType === 'IN';
        const statusBadge = isLate
          ? '<span class="px-2 py-1 text-xs rounded-full bg-rose-100 text-rose-700 font-medium">Late</span>'
          : '<span class="px-2 py-1 text-xs rounded-full bg-emerald-100 text-emerald-700 font-medium">On Time</span>';

        return `
          <tr>
            <td class="py-3 px-2 font-mono font-semibold">${log.biometricId}</td>
            <td class="py-3 px-2">${empName}</td>
            <td class="py-3 px-2 font-mono">${log.time}</td>
            <td class="py-3 px-2"><span class="px-2 py-0.5 text-xs rounded bg-slate-200">${log.punchType}</span></td>
            <td class="py-3 px-2">${statusBadge}</td>
          </tr>
        `;
      }).join('');
    }

    function exportCSV() {
      let csv = "Biometric ID,Employee Name,Department,Date,Time,Type\n";
      currentLogs.forEach(l => {
        const emp = employeeMap[l.biometricId] || { name: 'Unknown', dept: '' };
        csv += `${l.biometricId},"${emp.name}","${emp.dept}",${l.date},${l.time},${l.punchType}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Attendance_${dateInput.value}.csv`;
      a.click();
    }

    dateInput.addEventListener('change', (e) => subscribeLogs(e.target.value));
    subscribeLogs(dateInput.value);
  </script>
</body>
</html>
