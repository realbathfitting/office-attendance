<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Biometric Attendance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <div class="max-w-6xl mx-auto p-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-xl shadow-sm mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Office Attendance Portal</h1>
        <p class="text-sm text-slate-500">Live Biometric ADMS Sync &bull; <span id="device-status" class="font-semibold text-amber-600">Checking Device...</span></p>
      </div>
      <div class="flex gap-3">
        <input type="date" id="filter-date" class="border rounded-lg px-3 py-2 text-sm bg-slate-50" />
        <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
          Export CSV
        </button>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-5 rounded-xl shadow-sm">
        <p class="text-xs uppercase text-slate-400 font-semibold">Total Punches Today</p>
        <p id="stat-punches" class="text-3xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm">
        <p class="text-xs uppercase text-slate-400 font-semibold">Present Staff</p>
        <p id="stat-present" class="text-3xl font-bold text-blue-600 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm">
        <p class="text-xs uppercase text-slate-400 font-semibold">Late Arrivals (After 10:00 AM)</p>
        <p id="stat-late" class="text-3xl font-bold text-rose-600 mt-1">0</p>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Add Employee Card -->
      <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
        <h2 class="text-lg font-bold mb-4">Map Biometric ID</h2>
        <form id="emp-form" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Biometric Machine ID</label>
            <input type="text" id="emp-id" placeholder="e.g. 101" required class="w-full border rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Employee Name</label>
            <input type="text" id="emp-name" placeholder="e.g. Amit Sharma" required class="w-full border rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Department</
